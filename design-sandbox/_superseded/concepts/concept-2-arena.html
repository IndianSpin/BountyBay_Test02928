<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Concept 2 · The Bounty Arena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800;900&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body { font-family: 'IBM Plex Sans', sans-serif; background: #05060f; color: #efe3c8; overflow: hidden; }
  .scene { position: fixed; inset: 0; }
  .scene > svg { position: absolute; inset: 0; width: 100%; height: 100%; }

  .ui { position: fixed; inset: 0; pointer-events: none; }
  .ui > * { position: absolute; pointer-events: auto; }

  .brand { top: 16px; left: 20px; font-family: 'Outfit', sans-serif; font-weight: 900; font-size: 1rem; color: #e9b45c; letter-spacing: 0.06em; }
  .turn { top: 14px; right: 22px; font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 1.05rem; color: #ffd98a; text-shadow: 0 2px 10px rgba(0,0,0,.9); }

  /* my resources as field gear, bottom-left */
  .gear { bottom: 20px; left: 20px; display: flex; align-items: flex-end; gap: 14px; }
  .gear .torch { position: relative; }
  .gear .tag { font-size: 0.72rem; color: #d8c8a0; text-align: center; margin-top: 3px; text-shadow: 0 1px 4px rgba(0,0,0,.9); }
  .gear .pouch { position: relative; }

  .scroll { bottom: 22px; right: 20px; transform: rotate(-4deg); }
  .scroll .tag { font-size: 0.72rem; color: #d8c8a0; text-align: center; margin-top: 3px; text-shadow: 0 1px 4px rgba(0,0,0,.9); }

  .pennant { left: 50%; top: 17%; transform: translateX(-58%); width: 250px; }
  .pennant .msg { font-size: 0.85rem; font-style: italic; color: #f0e2bd; line-height: 1.4; text-shadow: 0 1px 4px rgba(0,0,0,.9); }
  .pennant .who { font-style: normal; font-weight: 600; display: block; }

  .compose { bottom: 18px; left: 50%; transform: translateX(-50%); display: flex; align-items: flex-end; gap: 10px; }
  .compose .slate { position: relative; }
  .compose .cost { font-size: 0.75rem; color: #d8c8a0; line-height: 1.35; text-shadow: 0 1px 4px rgba(0,0,0,.9); padding-bottom: 8px; }
  .compose .cost b { color: #ffd98a; }
  .compose button {
    font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 0.88rem; color: #201305;
    padding: 11px 18px; border: 0; border-radius: 3px; cursor: pointer;
    background: linear-gradient(180deg, #ecc27c, #c99b52);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.45), 0 3px 0 #6b4e1f, 0 6px 14px rgba(0,0,0,.6);
  }
  .compose button:active { transform: translateY(2px); box-shadow: inset 0 1px 0 rgba(255,255,255,.45), 0 1px 0 #6b4e1f; }
  .compose button.accept { background: linear-gradient(180deg, #f0d48e, #d3a44e); }
  .compose button.quit { background: linear-gradient(180deg, #8a5a44, #5e3826); color: #efe3c8; box-shadow: inset 0 1px 0 rgba(255,255,255,.15), 0 3px 0 #30170c, 0 6px 14px rgba(0,0,0,.6); }

  @media (max-width: 620px) {
    .brand { font-size: 0.85rem; }
    .turn { font-size: 0.9rem; right: 12px; }
    .pennant { width: 180px; top: 20%; }
    .pennant .msg { font-size: 0.75rem; }
    .compose button { font-size: 0.75rem; padding: 9px 12px; }
  }
</style>
</head>
<body>
<div class="scene">
<svg viewBox="0 0 1200 760" preserveAspectRatio="xMidYMid slice" role="img" aria-label="A stone arena at night under torchlight. Two figures face each other. Their offer numbers stand on tall standards joined by a taut rope. The Ruby Compass rests on a pedestal between them.">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0b1026"/><stop offset="70%" stop-color="#0d0c1c"/><stop offset="100%" stop-color="#151021"/></linearGradient>
    <radialGradient id="torch" cx="50%" cy="50%"><stop offset="0%" stop-color="#ffc46b" stop-opacity=".5"/><stop offset="100%" stop-color="#ffc46b" stop-opacity="0"/></radialGradient>
    <radialGradient id="beam" cx="50%" cy="0%"><stop offset="0%" stop-color="#ffe6b0" stop-opacity=".35"/><stop offset="100%" stop-color="#ffe6b0" stop-opacity="0"/></radialGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#4a3f33"/><stop offset="100%" stop-color="#2a231b"/></linearGradient>
    <radialGradient id="rubyA" cx="36%" cy="28%"><stop offset="0%" stop-color="#ff93a8"/><stop offset="45%" stop-color="#c22b4e"/><stop offset="100%" stop-color="#4a0a1e"/></radialGradient>
    <linearGradient id="brassA" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#e3bd77"/><stop offset="100%" stop-color="#8a6b34"/></linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="soft2" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="2.5"/></filter>
  </defs>

  <!-- sky + arena walls -->
  <rect width="1200" height="760" fill="url(#sky)"/>
  <g fill="#241d2e" opacity=".6">
    <circle cx="120" cy="90" r="1.5"/><circle cx="330" cy="60" r="1.2"/><circle cx="560" cy="120" r="1.4"/>
    <circle cx="800" cy="70" r="1.3"/><circle cx="1010" cy="110" r="1.5"/><circle cx="690" cy="150" r="1"/>
  </g>
  <!-- arena wall arc -->
  <path d="M0 250 Q600 90 1200 250 L1200 470 L0 470 Z" fill="url(#stone)" opacity=".92"/>
  <path d="M0 250 Q600 90 1200 250" fill="none" stroke="#5c4f3f" stroke-width="6"/>
  <g stroke="#3a322a" stroke-width="3" opacity=".6">
    <path d="M60 300 q300 -70 540 -10 M120 360 q320 -60 520 20 M60 420 q320 -30 560 50" fill="none"/>
  </g>
  <!-- pennant lines -->
  <path d="M0 180 Q600 60 1200 180" fill="none" stroke="#2b2420" stroke-width="2" opacity=".8"/>
  <g fill="#7a2e22"><path d="M180 158 l0 40 l30 -12 z"/><path d="M430 133 l0 40 l30 -12 z"/></g>
  <g fill="#2e4a52"><path d="M760 133 l0 40 l30 -12 z"/><path d="M1010 158 l0 40 l30 -12 z"/></g>

  <!-- stage floor -->
  <ellipse cx="600" cy="560" rx="520" ry="150" fill="#33261a"/>
  <ellipse cx="600" cy="560" rx="520" ry="150" fill="none" stroke="#4a3724" stroke-width="4"/>
  <g stroke="#241a10" stroke-width="2" opacity=".5">
    <path d="M200 500 q400 90 800 0 M260 580 q340 70 680 0" fill="none"/>
  </g>

  <!-- torches -->
  <g transform="translate(96 300)">
    <circle cx="0" cy="-6" r="120" fill="url(#torch)"/>
    <rect x="-9" y="0" width="18" height="110" rx="4" fill="#3a2c1c"/><rect x="-14" y="110" width="28" height="12" rx="3" fill="#241a10"/>
    <path d="M0 -20 q9 -18 0 -36 q-9 18 0 36 z" fill="#ff9d3d"/>
    <path d="M0 -20 q4 -9 0 -18 q-4 9 0 18 z" fill="#ffe6b0"/>
  </g>
  <g transform="translate(1104 300)">
    <circle cx="0" cy="-6" r="120" fill="url(#torch)"/>
    <rect x="-9" y="0" width="18" height="110" rx="4" fill="#3a2c1c"/><rect x="-14" y="110" width="28" height="12" rx="3" fill="#241a10"/>
    <path d="M0 -20 q9 -18 0 -36 q-9 18 0 36 z" fill="#ff9d3d"/>
    <path d="M0 -20 q4 -9 0 -18 q-4 9 0 18 z" fill="#ffe6b0"/>
  </g>

  <!-- THE OPPONENT: tall hooded figure, left -->
  <g transform="translate(300 470)">
    <ellipse cx="0" cy="150" rx="70" ry="12" fill="#000" opacity=".5" filter="url(#soft)"/>
    <path d="M-52 150 L-58 -40 q0 -52 58 -52 q58 0 58 52 L52 150 q-52 26 -104 0 z" fill="#140f14"/>
    <path d="M-58 -40 q0 -52 58 -52 q58 0 58 52" fill="none" stroke="#ffc46b" stroke-width="4" opacity=".45" filter="url(#soft2)"/>
    <path d="M-20 96 q40 12 40 0" stroke="#e8dcc0" stroke-width="3" fill="none" opacity=".2"/>
  </g>

  <!-- ME: merchant figure, right, spotlit -->
  <g transform="translate(900 470)">
    <ellipse cx="0" cy="150" rx="66" ry="12" fill="#000" opacity=".5" filter="url(#soft)"/>
    <path d="M-46 150 L-50 -14 l-12 -40 l12 -12 q30 -22 54 0 l14 8 l-8 44 L44 150 q-45 24 -90 0 z" fill="#1c1410"/>
    <path d="M-50 -14 l-12 -40 l12 -12 q30 -22 54 0 l14 8" fill="none" stroke="#ffc46b" stroke-width="4" opacity=".55" filter="url(#soft2)"/>
    <path d="M-34 -66 q34 -18 68 0 l-8 26 q-26 -12 -52 0 z" fill="#2b1c10"/>
  </g>

  <!-- spotlight beam on MY side -->
  <polygon points="900,-40 780,470 1020,470" fill="url(#beam)" opacity=".7"/>
  <ellipse cx="900" cy="470" rx="150" ry="40" fill="url(#beam)"/>

  <!-- OFFER STANDARDS with the taut rope -->
  <g transform="translate(452 400)">
    <rect x="-10" y="0" width="20" height="230" fill="#4a3822"/>
    <rect x="-34" y="-34" width="68" height="64" fill="url(#brassA)" stroke="#5e3c1e" stroke-width="2"/>
    <text x="0" y="10" text-anchor="middle" font-family="Outfit, sans-serif" font-size="34" font-weight="900" fill="#241505">82.5</text>
    <circle cx="-34" cy="-34" r="4" fill="#241505"/><circle cx="34" cy="-34" r="4" fill="#241505"/>
  </g>
  <g transform="translate(748 400)">
    <rect x="-10" y="0" width="20" height="230" fill="#4a3822"/>
    <rect x="-34" y="-34" width="68" height="64" fill="url(#brassA)" stroke="#5e3c1e" stroke-width="2"/>
    <text x="0" y="10" text-anchor="middle" font-family="Outfit, sans-serif" font-size="34" font-weight="900" fill="#241505">63.0</text>
    <circle cx="-34" cy="-34" r="4" fill="#241505"/><circle cx="34" cy="-34" r="4" fill="#241505"/>
  </g>
  <!-- the taut rope: concessions move these plates -->
  <path d="M486 396 Q600 430 714 396" fill="none" stroke="#c9b98d" stroke-width="5"/>
  <circle cx="600" cy="412" r="11" fill="none" stroke="#c9b98d" stroke-width="4"/>
  <circle cx="600" cy="412" r="3" fill="#c9b98d"/>

  <!-- THE RUBY COMPASS on its pedestal -->
  <g transform="translate(600 330)">
    <polygon points="600,330 512,470 688,470" fill="none"/>
    <g transform="translate(0 -120)">
      <rect x="-46" y="44" width="92" height="64" fill="#2b231b" stroke="#4a3f33" stroke-width="3"/>
      <rect x="-46" y="44" width="92" height="10" fill="#4a3f33"/>
      <circle cx="0" cy="0" r="64" fill="url(#brassA)"/>
      <circle cx="0" cy="0" r="58" fill="url(#rubyA)"/>
      <ellipse cx="-15" cy="-19" rx="24" ry="14" fill="#ffffff" opacity=".3" filter="url(#soft2)"/>
      <circle cx="0" cy="0" r="58" fill="none" stroke="#e3bd77" stroke-width="3"/>
      <g stroke="#e3bd77" stroke-width="2.5">
        <line x1="0" y1="-58" x2="0" y2="-44"/><line x1="0" y1="44" x2="0" y2="58"/>
        <line x1="-58" y1="0" x2="-44" y2="0"/><line x1="44" y1="0" x2="58" y2="0"/>
      </g>
      <polygon points="0,-38 8,6 0,0 -8,6" fill="#ffd98a"/>
      <circle cx="0" cy="0" r="7" fill="#c9a15a" stroke="#5e3c1e" stroke-width="2"/>
    </g>
  </g>

  <!-- overhead beam on the asset -->
  <polygon points="600,-40 500,330 700,330" fill="url(#beam)" opacity=".55"/>

  <!-- my gear: coin pouch + time torch -->
  <g transform="translate(60 560)">
    <path d="M-34 -8 q0 -34 34 -34 q34 0 34 34 l0 10 q-34 26 -68 0 z" fill="#5e3c1e" stroke="#3a2410" stroke-width="3"/>
    <path d="M-34 -8 q0 -34 34 -34 q34 0 34 34" fill="none" stroke="#c9a15a" stroke-width="4"/>
    <ellipse cx="2" cy="0" rx="20" ry="8" fill="#e3bd77"/><ellipse cx="-6" cy="-8" rx="18" ry="7" fill="#ffd98a"/>
    <ellipse cx="10" cy="-14" rx="16" ry="6" fill="#e3bd77"/>
    <text x="0" y="46" text-anchor="middle" font-size="13" fill="#d8c8a0">72 coins</text>
  </g>
  <g transform="translate(180 620)">
    <rect x="-7" y="0" width="14" height="86" rx="3" fill="#3a2c1c"/><rect x="-12" y="86" width="24" height="10" rx="2" fill="#241a10"/>
    <path d="M0 -16 q8 -14 0 -28 q-8 14 0 28 z" fill="#ff9d3d"/>
    <path d="M0 -16 q4 -7 0 -14 q-4 7 0 14 z" fill="#ffe6b0"/>
    <text x="0" y="112" text-anchor="middle" font-size="12.5" fill="#d8c8a0">bounty × 91%</text>
  </g>

  <!-- sealed mandate scroll, my corner -->
  <g transform="translate(1080 600) rotate(-5)">
    <rect x="-34" y="-14" width="92" height="28" rx="12" fill="#e8dcc0" stroke="#c9b98d" stroke-width="2"/>
    <rect x="-34" y="-14" width="92" height="28" rx="12" fill="none" stroke="#c9b98d"/>
    <circle cx="34" cy="0" r="9" fill="#7a2020"/><circle cx="34" cy="0" r="9" fill="none" stroke="#a83232" stroke-width="2.5"/>
  </g>
</svg>
</div>

<div class="ui">
  <div class="brand">BOUNTY BAY</div>
  <div class="turn">YOUR MOVE</div>

  <div class="pennant">
    <div class="msg"><span class="who">The hooded one:</span> "I can move, but not much."</div>
  </div>

  <div class="compose">
    <div class="slate">
      <svg width="120" height="58" viewBox="0 0 120 58" aria-hidden="true">
        <rect x="0" y="0" width="120" height="58" rx="4" fill="#1f2b26" stroke="#5c4f3f" stroke-width="3"/>
        <text x="60" y="39" text-anchor="middle" font-family="Outfit, sans-serif" font-size="28" font-weight="800" fill="#e8dcc0">60</text>
      </svg>
    </div>
    <div class="cost">move −3.0<br>cost <b>5</b> · <b>67</b> left</div>
    <button>Make Offer</button>
    <button class="accept">Accept 82.5</button>
    <button class="quit">Walk Away</button>
  </div>
</div>
</body>
</html>
