</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=Space+Grotesk:wght@500;600;700&amp;family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;padding:0;background:#17242D;font-family:'Inter',system-ui,sans-serif;color:#F3EEDD}
a{color:#D9A653}a:hover{color:#F5D48E}
</style>
</helmet>
<div class="world world--deep phone" style="width: 390px; height: 844px; ">
<div style="position: absolute; inset: 0; padding: 60px 22px 34px; display: flex; flex-direction: column; gap: 18px;">
<div style="display: flex; align-items: center; gap: 10px;"><button class="gbtn gbtn--icon" type="button" aria-label="Back" style="width: 40px; height: 40px;"><svg class="ico ico--sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 3.5L7 12l8.5 8.5 2.1-2.1L11.2 12l6.4-6.4z"/></svg></button><span class="display-subtitle">Voice Deal</span><span class="pill pill--teal">RANKED · VOICE</span></div>
<div class="panel" style="padding: 22px; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center;">
<div style="position: relative; width: 120px; height: 120px; display: flex; align-items: center; justify-content: center;"><span class="pulse-ring" style="inset: 0; border-color: rgba(47,191,168,.5);"></span><span class="pulse-ring" style="inset: 16px;"></span><span class="ico-chip ico-chip--teal" style="width: 72px; height: 72px;"><svg class="ico ico--xl" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a4 4 0 014 4v6a4 4 0 01-8 0V6a4 4 0 014-4zM5 11h2a5 5 0 0010 0h2a7 7 0 01-6 6.9V21h3v2H8v-2h3v-3.1A7 7 0 015 11z"/></svg></span></div>
<span class="display-title">Mic check</span><span class="body muted">Say something. You should see the bars move.</span><span style="display: inline-flex; align-items: center; gap: 3px; height: 32px;"><span style="width: 4px; height: 13px; border-radius: 2px; background: var(--resource-chip); opacity: 1;"></span><span style="width: 4px; height: 24px; border-radius: 2px; background: var(--resource-chip); opacity: 1;"></span><span style="width: 4px; height: 23px; border-radius: 2px; background: var(--resource-chip); opacity: 1;"></span><span style="width: 4px; height: 10px; border-radius: 2px; background: var(--resource-chip); opacity: 1;"></span><span style="width: 4px; height: 17px; border-radius: 2px; background: var(--resource-chip); opacity: 1;"></span><span style="width: 4px; height: 25px; border-radius: 2px; background: var(--resource-chip); opacity: 1;"></span><span style="width: 4px; height: 21px; border-radius: 2px; background: var(--resource-chip); opacity: 1;"></span><span style="width: 4px; height: 26px; border-radius: 2px; background: var(--resource-chip); opacity: 1;"></span><span style="width: 4px; height: 24px; border-radius: 2px; background: var(--resource-chip); opacity: 1;"></span><span style="width: 4px; height: 8px; border-radius: 2px; background: var(--resource-chip); opacity: 1;"></span><span style="width: 4px; height: 25px; border-radius: 2px; background: var(--resource-chip); opacity: 1;"></span><span style="width: 4px; height: 6px; border-radius: 2px; background: var(--resource-chip); opacity: 1;"></span><span style="width: 4px; height: 21px; border-radius: 2px; background: var(--resource-chip); opacity: 1;"></span><span style="width: 4px; height: 14px; border-radius: 2px; background: var(--resource-chip); opacity: 1;"></span><span style="width: 4px; height: 23px; border-radius: 2px; background: var(--resource-chip); opacity: 1;"></span><span style="width: 4px; height: 13px; border-radius: 2px; background: var(--resource-chip); opacity: 1;"></span><span style="width: 4px; height: 12px; border-radius: 2px; background: var(--resource-chip); opacity: 1;"></span><span style="width: 4px; height: 28px; border-radius: 2px; background: var(--resource-chip); opacity: 1;"></span></span>
<div style="display: flex; gap: 8px; align-items: center;"><span style="display: inline-flex; align-items: flex-end; gap: 2px;" aria-label="Connection Good"><span style="width: 5px; height: 6px; border-radius: 2px; background: var(--positive);"></span><span style="width: 5px; height: 10px; border-radius: 2px; background: var(--positive);"></span><span style="width: 5px; height: 14px; border-radius: 2px; background: var(--positive);"></span><span style="width: 5px; height: 18px; border-radius: 2px; background: var(--positive);"></span></span><span class="caption muted">Built-in microphone · AirPods available</span></div>
<button class="gbtn gbtn--secondary gbtn--sm" type="button">Change device</button></div>
<div class="spec-card" style="display: flex; flex-direction: column; gap: 10px; padding: 16px;">
<span class="frame-label">Voice rules</span>
<div style="display: flex; gap: 10px;"><svg class="ico " viewBox="0 0 24 24" aria-hidden="true" style="color: var(--brand-gold);"><path d="M9 2h6v3a3 3 0 01-1 2.2V10h5a2 2 0 012 2v3H3v-3a2 2 0 012-2h5V7.2A3 3 0 019 5zM3 17h18v2H3zm2 3h14v2H5z"/></svg><span class="body">Spoken numbers aren’t offers. Use the plates.</span></div>
<div style="display: flex; gap: 10px;"><svg class="ico " viewBox="0 0 24 24" aria-hidden="true" style="color: var(--brand-gold);"><path d="M3.3 2.3l18.4 18.4-1.4 1.4-3.5-3.5A11 11 0 0112 20C6 20 2.3 15.5 1 12c.6-1.6 1.7-3.4 3.4-5L1.9 3.7zM12 4c6 0 9.7 4.5 11 8-.5 1.4-1.4 2.9-2.6 4.3L8.3 4.5A11 11 0 0112 4zm-4.4 6.2A4.5 4.5 0 0013.8 16.4z"/></svg><span class="body">Voice isn’t recorded.</span></div>
<div style="display: flex; gap: 10px;"><svg class="ico " viewBox="0 0 24 24" aria-hidden="true" style="color: var(--brand-gold);"><path d="M4 3h16a2 2 0 012 2v11a2 2 0 01-2 2h-7l-5 4v-4H4a2 2 0 01-2-2V5a2 2 0 012-2zm3 6v2h2V9zm4 0v2h2V9zm4 0v2h2V9z"/></svg><span class="body">Text chat stays available if voice drops.</span></div></div>
<div style="flex-grow: 1;"></div>
<button class="gbtn gbtn--primary gbtn--xl gbtn--block" type="button"><svg class="ico gbtn__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 2h5l9 9-2 2-9-9v3H2zm20 0v5h-3v-2l-5.5 5.5-2-2L17 3h-2V2zM6.5 14.5l2 2-2.2 2.2L8 20.5 6.5 22 2 17.5 3.5 16l1.8 1.8zm11 0l2.2 2.2L21.5 15l1.5 1.5L18.5 22 17 20.5l1.8-1.8-2.3-2.2z"/></svg><span class="button-label">FIND A VOICE RIVAL</span></button><button class="gbtn gbtn--ghost gbtn--lg gbtn--block" type="button"><span class="button-label">Play without voice</span></button></div>
</div>
