<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Report</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="../styles/ds-bundle.css">
<link rel="stylesheet" href="../styles/bb.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=Space+Grotesk:wght@500;600;700&amp;family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;padding:0;background:#17242D;font-family:'Inter',system-ui,sans-serif;color:#F3EEDD}
a{color:#D9A653}a:hover{color:#F5D48E}
</style>
</helmet>
<div class="world world--deep phone" style="width: 390px; height: 844px; ">
<div class="scrim"></div><div class="bottom-sheet" style="padding: 12px 20px 34px; display: flex; flex-direction: column; gap: 10px;"><div class="bottom-sheet__handle"></div>
<div style="display: flex; align-items: center; gap: 10px;"><span class="avatar avatar--sm avatar--opponent"><img src="../assets/goldenotter.svg" alt="goldenotter avatar"></span><span class="display-subtitle ink-p">Report GOLDENOTTER</span></div>
<span class="body muted-p">Bluffing and hard bargaining are part of the game. Report behaviour that crosses a line.</span><label style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; background: var(--surface-parchment-deep); box-shadow: inset 0 0 0 2px var(--crimson);"><input type="radio" name="r" checked style="width: 20px; height: 20px; accent-color: #E2495A;"><div style="display: flex; flex-direction: column;"><span class="body-strong ink-p">Abusive chat</span><span class="caption muted-p">Insults, harassment, hate</span></div></label><label style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; background: var(--surface-parchment-deep); "><input type="radio" name="r" style="width: 20px; height: 20px; accent-color: #E2495A;"><div style="display: flex; flex-direction: column;"><span class="body-strong ink-p">Spam</span><span class="caption muted-p">Links, ads, repeated messages</span></div></label><label style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; background: var(--surface-parchment-deep); "><input type="radio" name="r" style="width: 20px; height: 20px; accent-color: #E2495A;"><div style="display: flex; flex-direction: column;"><span class="body-strong ink-p">Suspicious behaviour</span><span class="caption muted-p">Collusion, bot-like play, stalling</span></div></label><label style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; background: var(--surface-parchment-deep); "><input type="radio" name="r" style="width: 20px; height: 20px; accent-color: #E2495A;"><div style="display: flex; flex-direction: column;"><span class="body-strong ink-p">Something else</span><span class="caption muted-p">Tell us in a sentence</span></div></label>
<label style="display: flex; align-items: center; gap: 12px; padding: 8px 2px;"><input type="checkbox" checked style="width: 20px; height: 20px; accent-color: #D9A653;"><span class="body ink-p">Also block GOLDENOTTER</span></label>
<div style="display: flex; gap: 10px;"><button class="gbtn gbtn--parch gbtn--lg" type="button"><span class="button-label">Cancel</span></button><button class="gbtn gbtn--destructive gbtn--lg" type="button" style="flex: 1;"><span class="button-label">SEND REPORT</span></button></div>
<span class="caption muted-p" style="text-align: center;">The match continues. Your report includes this match’s chat log.</span></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
