<link rel="stylesheet" href="../styles/ds-bundle.css">

</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=Space+Grotesk:wght@500;600;700&amp;family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;padding:0;background:#17242D;font-family:'Inter',system-ui,sans-serif;color:#F3EEDD}
a{color:#D9A653}a:hover{color:#F5D48E}
</style>
</helmet>
<div class="world world--dim" style="width: 1440px; height: 900px; ">
<div style="position: absolute; left: 0; right: 0; top: 0; height: 70px; display: flex; align-items: center; gap: 14px; padding: 0 32px;"><span class="wordmark" style="font-size: 24px; line-height: 1;">Bounty Bay</span><span class="pill pill--gold"><svg class="ico ico--sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 2h5l9 9-2 2-9-9v3H2zm20 0v5h-3v-2l-5.5 5.5-2-2L17 3h-2V2zM6.5 14.5l2 2-2.2 2.2L8 20.5 6.5 22 2 17.5 3.5 16l1.8 1.8zm11 0l2.2 2.2L21.5 15l1.5 1.5L18.5 22 17 20.5l1.8-1.8-2.3-2.2z"/></svg>RANKED</span><div style="flex-grow: 1;"></div></div>
<div style="position: absolute; inset: 70px 0 0 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;"><div style="position: relative; width: 168px; height: 168px; display: flex; align-items: center; justify-content: center;"><span class="pulse-ring anim-breathe" style="inset: 0px; animation-delay: 0.0s;"></span><span class="pulse-ring anim-breathe" style="inset: -34px; animation-delay: 0.4s;"></span><span class="pulse-ring anim-breathe" style="inset: -68px; animation-delay: 0.8s;"></span><span class="turn-ring turn-ring--player"><span class="avatar avatar--xxl avatar--player"><img src="../assets/blackparrot.svg" alt="blackparrot avatar"></span></span></div>
<span class="display-hero" style="margin-top: 50px;">Finding a rival…</span>
<span class="clock-pill" style="font-size: 18px;"><svg class="ico ico--sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 110 20 10 10 0 010-20zm-1 4v7l5.5 3.3 1-1.7-4.5-2.6V6z"/></svg> 0:07</span>
<span class="body muted">Looking for players near <b class="num" style="color: var(--ink-on-dark);">1,482</b> · Merchant II</span>
<div class="panel" style="padding: 12px 18px; display: flex; gap: 12px; align-items: center;"><svg class="ico " viewBox="0 0 24 24" aria-hidden="true" style="color: var(--brand-seaglass);"><path d="M12 2a10 10 0 110 20 10 10 0 010-20zm-1.5 8v8h3v-8zm1.5-5a1.8 1.8 0 100 3.6A1.8 1.8 0 0012 5z"/></svg><span class="caption muted">Tip: your opening offer is free — the moves after it are not.</span></div>
<button class="gbtn gbtn--secondary gbtn--lg" type="button"><svg class="ico gbtn__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5.6 3.5L12 9.9l6.4-6.4 2.1 2.1-6.4 6.4 6.4 6.4-2.1 2.1-6.4-6.4-6.4 6.4-2.1-2.1 6.4-6.4-6.4-6.4z"/></svg><span class="button-label">CANCEL SEARCH</span></button></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 1440, "height": 900}}'>
class Component extends DCLogic {
  renderVals() { return {}; }

</html>
