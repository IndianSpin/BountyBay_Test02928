<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GOLDEN · Live match — my decision, close</title>
<link rel="stylesheet" href="../golden.css">
<style>
/* LIVE MATCH v4 — one focal point: the fight on the table (the band), then her, then my decision.
   Reading order (desktop, Z): clock → her → the band → the decision. Everything else is quiet glass at the edges. */
.sheet { display: none; }
.lm-char { left: 50%; bottom: 27%; height: 62%; aspect-ratio: 2 / 3; transform: translateX(-50%); }
.lm-menu { position: absolute; left: 20px; top: 18px; width: 52px; height: 52px; border-radius: 50%; font-size: 22px; font-weight: 800; cursor: pointer; }

/* the clock and, under it, what the clock costs you (rec 3) */
.lm-clock { left: 50%; top: 16px; transform: translateX(-50%); }
.lm-drain { left: 50%; top: 88px; transform: translateX(-50%); }

/* her name plate lives next to her, not in a corner card (V10); the rivalry is part of who she is (rec 5) */
.lm-opp { position: absolute; left: calc(50% + 150px); top: 21%; display: flex; flex-direction: column; gap: 6px; padding: 12px 16px; border-radius: var(--r-md); }
.lm-opp .name { font-family: var(--font-world); font-weight: 800; font-size: var(--fs-h3); line-height: 1; }
.lm-opp .name .num { font-size: var(--fs-body); color: var(--lx-muted); margin-left: 6px; }
.lm-opp .row { display: flex; gap: 6px; align-items: center; }
.rival { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: var(--r-pill); background: rgba(139,107,209,.22); border: 1px solid rgba(185,162,240,.5);
  color: #D9CCFA; font-size: var(--fs-cap); font-weight: 800; letter-spacing: .06em; white-space: nowrap; }
.rival b { font-family: var(--font-num); color: #fff; }
.lm-asset { display: flex; align-items: center; gap: 6px; font-size: var(--fs-cap); font-weight: 700; color: var(--lx-muted); letter-spacing: .04em; }
.lm-asset img { width: 20px; height: 20px; }

.lm-bubble { right: calc(50% + 140px); top: 22%; }
.lm-bubble::after { right: -8px; bottom: 26px; transform: rotate(-45deg); }
/* the tell: public information only (her step sizes), read as a pattern (rec 9) */
.lm-tell { position: absolute; right: calc(50% + 140px); top: calc(22% + 92px); padding: 6px 12px; font-size: var(--fs-body); }
.lm-tell b { font-family: var(--font-num); color: #D9CCFA; }
.lm-tell .arrow { color: var(--lx-muted); }

/* THE BAND — the fight is the biggest object on the table (rec 2, V6) */
.lm-band { position: absolute; left: 21%; right: 19%; top: 68%; height: 30px; }
.lm-band::before, .lm-band::after { content: ''; position: absolute; top: -5px; bottom: -5px; width: 14px; border-radius: 7px; background: var(--lx-brass); box-shadow: 0 4px 10px rgba(0,0,0,.5); }
.lm-band::before { left: -10px; } .lm-band::after { right: -10px; }
.lm-track { position: absolute; inset: 0; border-radius: var(--r-pill); background: linear-gradient(#120A08, #24160F);
  box-shadow: inset 0 3px 8px rgba(0,0,0,.8), 0 0 0 1px rgba(255,236,205,.18), 0 10px 26px rgba(0,0,0,.5); overflow: hidden; }
.lm-track .gapseg { position: absolute; top: 0; bottom: 0; background: linear-gradient(rgba(255,210,122,.9), rgba(233,180,90,.75)); }
.lm-track .gapseg.old { background: rgba(255,210,122,.2); }
.lm-track .gapseg.now { box-shadow: 0 0 18px 6px rgba(255,200,110,.75); }
.lm-band .tick { position: absolute; top: 32px; transform: translateX(-50%); font-family: var(--font-num); font-weight: 700; font-size: var(--fs-cap); color: var(--lx-faint); }
.lm-band .tick.end { color: var(--lx-muted); }
.lm-band .plaque { bottom: 44px; }
.lm-band .plaque::after { content: ''; position: absolute; left: 50%; bottom: -9px; width: 14px; height: 14px; margin-left: -7px; transform: rotate(45deg); background: inherit; border-radius: 2px; z-index: -1; }
.lm-band .pin { position: absolute; top: -8px; bottom: -8px; width: 4px; margin-left: -2px; border-radius: 2px; }
.lm-gap { position: absolute; left: 50%; top: calc(68% + 58px); transform: translateX(-50%); display: flex; align-items: baseline; gap: 10px; padding: 6px 18px; }
.lm-gap .k { font-size: var(--fs-cap); font-weight: 800; letter-spacing: .12em; color: var(--lx-muted); }
.lm-gap .g { font-family: var(--font-num); font-weight: 700; font-size: var(--fs-h3); color: var(--lx-gold); line-height: 1; }
.lm-gap .was { font-size: var(--fs-body); color: var(--lx-muted); }
.lm-gap.snap { animation: g-snap var(--t-settle) var(--ease-pop); }
@keyframes g-snap { 0% { scale: 1.25; } 100% { scale: 1; } }

.lm-turn { position: absolute; left: 50%; bottom: calc(4% + 88px); transform: translateX(-50%); color: var(--lx-gold); border-color: rgba(255,210,122,.45); }

/* my hand: the sealed limit, chips, dossier — one card at the left edge */
.lm-hand { position: absolute; left: 20px; top: 49%; width: 260px; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
.lm-limit { position: relative; display: flex; align-items: center; gap: 12px; }
.lm-limit .seal { width: 40px; height: 40px; flex: none; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #FF8A8A, #C73A4B 55%, #7E1B28);
  box-shadow: 0 2px 4px rgba(0,0,0,.5), inset 0 -2px 3px rgba(0,0,0,.3); display: flex; align-items: center; justify-content: center; color: #FFE3E0; font-size: 16px; }
.lm-limit .kicker { color: var(--lx-muted); }
.lm-limit .v { font-family: var(--font-num); font-weight: 700; font-size: var(--fs-h2); line-height: 1; color: #FFF3DA; }
.lm-hand hr { border: 0; height: 1px; background: var(--lx-rim); margin: 0; }
.lm-chips { display: flex; align-items: center; gap: 12px; }
.lm-chips .ico { width: 40px; height: 40px; flex: none; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #D8FFF7, #2FBFA8 50%, #1F8F7E); color: #0B3F39;
  display: flex; align-items: center; justify-content: center; font-weight: 800; box-shadow: 0 2px 4px rgba(0,0,0,.5); }
.lm-chips .l { font-size: var(--fs-cap); font-weight: 800; letter-spacing: .1em; color: var(--lx-muted); }
.lm-chips .v { font-family: var(--font-num); font-weight: 700; font-size: var(--fs-h3); line-height: 1; white-space: nowrap; }
.lm-chips .v small { font-size: var(--fs-body); color: var(--lx-muted); }
.lm-dossier { min-height: 44px; }

.lm-decide { position: absolute; left: 50%; bottom: 4%; transform: translateX(-50%); display: flex; gap: 14px; align-items: flex-end; }
.lm-decide .btn-gold, .lm-decide .btn-green { min-width: 230px; min-height: 76px; font-size: var(--fs-h3); }
.lm-decide .btn-quiet { min-height: 56px; }

.lm-chat { position: absolute; left: 20px; bottom: 4%; width: 330px; display: flex; flex-direction: column; gap: 8px; }
.lm-quick { display: flex; gap: 6px; }
.lm-quick button { padding: 7px 12px; min-height: 36px; border-radius: var(--r-pill); font-family: var(--font-ui); font-weight: 700; font-size: var(--fs-body); cursor: pointer; }
.lm-compose { display: flex; gap: 8px; height: 52px; padding: 5px; border-radius: var(--r-md); }
.lm-compose input { flex: 1; min-width: 0; border: 0; border-radius: var(--r-sm); padding: 0 12px; background: rgba(0,0,0,.3); color: var(--lx-ink); font: 600 var(--fs-body) var(--font-ui); }
.lm-compose .btn { min-height: 0; padding: 0 14px; font-size: var(--fs-body); }

/* ---------- mobile (390×844): scene on top, the band across the table, clock on the seam, the decision at the thumb */
@media (max-width: 600px) {
  .w-counter { height: 14%; bottom: 44%; }
  .sheet { display: block; position: absolute; left: 0; right: 0; bottom: 0; height: 44%; background: linear-gradient(#24160F, #120A08); border-top: 1px solid var(--lx-rim); box-shadow: 0 -18px 40px rgba(0,0,0,.45); }
  .lm-char { left: 58%; bottom: 55%; height: 34%; }
  .lm-menu { left: 10px; top: 10px; width: 40px; height: 40px; font-size: 18px; }
  .lm-opp { left: auto; right: 8px; top: 8px; padding: 8px 10px; gap: 4px; }
  .lm-opp .name { font-size: var(--fs-lead); } .lm-asset { display: none; }
  .lm-bubble { right: auto; left: 8px; top: 13%; max-width: 150px; font-size: var(--fs-body); padding: 8px 10px 10px; }
  .lm-bubble::after { right: 26px; bottom: -8px; transform: rotate(45deg); }
  .lm-tell { right: auto; left: 8px; top: calc(13% + 84px); font-size: var(--fs-cap); padding: 4px 10px; }
  .lm-band { left: 6%; right: 6%; top: 43%; height: 18px; }
  .lm-band .plaque { min-width: 76px; height: 46px; font-size: 28px; bottom: 30px; padding: 0 10px; }
  .lm-band .plaque .lab { font-size: 12px; top: -20px; }
  .lm-band .tick { display: none; } .lm-band .tick.end { display: block; top: 20px; }
  .lm-gap { top: calc(43% + 26px); padding: 3px 12px; } .lm-gap .was { display: none; } .lm-gap .g { font-size: var(--fs-lead); }
  .lm-clock { top: calc(56% - 32px); transform: translateX(-50%) scale(.78); z-index: 5; }
  .lm-drain { top: calc(56% + 16px); padding: 3px 10px 3px 6px; } .lm-drain .l, .lm-drain .meter { display: none; }
  .lm-turn { left: 10px; top: 58px; bottom: auto; transform: none; }
  .lm-hand { left: 10px; right: 10px; top: auto; bottom: calc(44% - 128px); width: auto; flex-direction: row; align-items: center; gap: 10px; padding: 8px 10px; }
  .lm-hand hr { width: 1px; height: 36px; }
  .lm-limit .seal, .lm-chips .ico { width: 30px; height: 30px; font-size: 13px; }
  .lm-limit .v { font-size: var(--fs-h3); } .lm-chips .v { font-size: var(--fs-lead); }
  .lm-limit .kicker, .lm-chips .l { font-size: 12px; letter-spacing: .02em; }
  .lm-dossier { margin-left: auto; padding: 0 10px; font-size: var(--fs-cap); }
  .lm-chat { left: 10px; right: 10px; width: auto; bottom: 150px; }
  .lm-quick button { padding: 5px 10px; min-height: 32px; font-size: var(--fs-cap); }
  .lm-compose { height: 46px; }
  .lm-decide { left: 10px; right: 10px; bottom: 16px; transform: none; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .lm-decide .btn-gold { grid-column: 1 / 3; grid-row: 2; min-height: 62px; font-size: var(--fs-h3); }
  .lm-decide .btn-green { min-width: 0; min-height: 54px; font-size: var(--fs-lead); }
  .lm-decide .btn-quiet { min-height: 54px; }
}
</style>
</head>
<body>
<main class="stage" data-testid="market-world">
  <div data-world data-focus="50% 66%"></div>
  <div class="sprite lm-char" data-testid="opponent-character" data-sprite="goldenotter:listen" role="img" aria-label="KESTREL as Golden Otter, listening"></div>
  <div data-counter></div>
  <div class="sheet"></div>

  <button class="glass lm-menu" data-testid="match-menu" aria-label="Match menu">⋯</button>

  <div class="clock lm-clock" data-testid="clock-medallion" aria-label="Decision clocks">
    <div class="face mine on" data-testid="clock-mine"><span class="dot"></span><span class="who">YOU</span><span class="t" data-fx="live.clock.meRemaining">6:33</span><span class="m">×<span data-fx="live.clock.meMultiplier">84%</span></span></div>
    <span class="lever" style="transform:rotate(-24deg)"></span>
    <div class="face theirs off" data-testid="clock-theirs"><span class="who">KESTREL</span><span class="t" data-fx="live.clock.themRemaining">6:45</span><span class="m">×<span data-fx="live.clock.themMultiplier">91%</span></span></div>
  </div>
  <div class="glass drain lm-drain" data-testid="bounty-drain" aria-label="Your bounty multiplier, falling while your clock runs">
    <span class="pile"><i></i><i></i><i></i><i></i><span class="fall"></span><span class="fall"></span></span>
    <span><span class="v">×84%</span> <span class="l">falls while you think</span><span class="meter"><b style="width:84%"></b></span></span>
  </div>

  <section class="glass lm-opp" data-testid="opponent-hud">
    <div class="name">KESTREL<span class="num">1,494</span></div>
    <div class="row"><span class="rival" data-testid="rival-record">RIVAL · <b>1–0</b> you</span></div>
    <div class="lm-asset" data-testid="scenario-display"><img src="../../../apps/web/public/game/asset-compass.svg" alt="">Selling <span data-fx="asset.name">THE RUBY COMPASS</span></div>
  </section>

  <div class="bubble lm-bubble tl-hidden" data-testid="opponent-bubble"><span data-fx="offers.8.pitch">Seventy-four. That's the last step.</span></div>
  <div class="glass pill lm-tell tl-hidden" data-testid="opponent-tell" title="Her steps down, from her offers">Her steps <b>24</b><span class="arrow">›</span><b>12</b><span class="arrow">›</span><b>6</b><span class="arrow">›</span><b>4</b></div>

  <div class="lm-band" data-testid="price-rail" id="rail"><div class="lm-track" id="track"></div></div>
  <div class="glass lm-gap" data-testid="gap-label"><span class="k">GAP</span><span class="g">2</span><span class="was">was 65</span></div>

  <aside class="card lm-hand" data-testid="my-hand">
    <div class="lm-limit" data-testid="my-rv" data-term="reservation value"><span class="seal">✦</span><div><div class="kicker">Your limit</div><div class="v" data-fx="me.reservationValue">100</div></div></div>
    <hr>
    <div class="lm-chips" data-testid="chip-meter"><span class="ico">◎</span><div><div class="l">CHIPS</div><div class="v"><span data-fx="live.chips.remaining">88</span><small> / 100</small></div></div></div>
    <button class="btn btn-quiet lm-dossier" data-testid="dossier">Her dossier</button>
  </aside>

  <div class="lm-chat" data-testid="chat-panel">
    <div class="lm-quick"><button class="glass">Why?</button><button class="glass">We're close</button><button class="glass" aria-label="More quick lines">＋</button></div>
    <div class="glass lm-compose"><input aria-label="Talk to KESTREL" placeholder="Talk to KESTREL…"><button class="btn btn-quiet">Send</button></div>
  </div>

  <div class="ribbon lm-turn" data-testid="turn-banner">YOUR MOVE</div>
  <div class="lm-decide tl-hidden" data-testid="decision-row">
    <button class="btn btn-quiet" data-testid="walk-button">Walk away</button>
    <button class="btn btn-green" data-testid="accept-button"><span class="stack">ACCEPT 74<span class="btn-sub">hold to seal</span></span></button>
    <button class="btn btn-gold breathe" data-testid="make-offer"><span class="stack">MAKE OFFER<span class="btn-sub">costs chips</span></span></button>
  </div>
</main>
<script src="../world.js"></script>
<script src="../golden.js"></script>
<script>
(async () => {
  // the band is anchored to the two OPENING offers (never to either limit): 55 … 120
  const rail = document.getElementById('rail'), track = document.getElementById('track'), lo = 55, hi = 120, pad = (hi - lo) * .04;
  const X = (v) => ((v - lo + pad) / (hi - lo + 2 * pad)) * 100;
  // every round's gap, drawn on the track: faint when old, bright now — the table converges toward the middle
  const rounds = [[55, 120], [61, 96], [67, 84], [72, 78]];
  track.innerHTML = rounds.map(([a, b], i) => `<span class="gapseg old" style="left:${X(a)}%;width:${X(b) - X(a)}%;opacity:${.5 + i * .15}"></span>`).join('') +
    `<span class="gapseg now" style="left:${X(72)}%;width:${X(74) - X(72)}%"></span>`;
  rail.insertAdjacentHTML('beforeend',
    [55, 120].map((v) => `<span class="tick end" style="left:${X(v)}%">${v}</span>`).join('') +
    `<span class="pin" style="left:${X(74)}%;background:var(--opponent)"></span><span class="pin" style="left:${X(72)}%;background:var(--player)"></span>` +
    `<div class="plaque them hero tl-hidden" data-testid="rail-offer-theirs"><span class="lab">KESTREL</span>74</div>` +
    `<div class="plaque me" data-testid="rail-offer-mine"><span class="lab">YOU</span>72</div>`);
  // plaques sit on their true positions; when they would touch they part around the midpoint (pins keep the exact values)
  const place = () => {
    const W = rail.clientWidth, t = rail.querySelector('.them'), m = rail.querySelector('.me');
    let xt = X(74) / 100 * W, xm = X(72) / 100 * W; const need = (t.offsetWidth + m.offsetWidth) / 2 + 14;
    if (xt - xm < need) { const mid = (xt + xm) / 2; xt = mid + need / 2; xm = mid - need / 2; }
    t.style.left = xt + 'px'; m.style.left = xm + 'px';
  };
  place(); addEventListener('resize', place);
  await Golden.boot('live-match');
})();
</script>
</body>
</html>
