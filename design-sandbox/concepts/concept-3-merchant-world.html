<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Concept 3 · The Merchant World</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&family=IBM+Plex+Sans:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body { font-family: 'IBM Plex Sans', sans-serif; background: #10262e; color: #fdf3dd; overflow: hidden; }
  .scene { position: fixed; inset: 0; }
  .scene > svg { position: absolute; inset: 0; width: 100%; height: 100%; }

  .ui { position: fixed; inset: 0; pointer-events: none; }
  .ui > * { position: absolute; pointer-events: auto; }

  .brand { top: 16px; left: 20px; font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 1rem; color: #ffd98a; text-shadow: 0 1px 6px rgba(0,0,0,.7); }
  .turn { top: 14px; right: 22px; font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 1rem; color: #ffe9b8; text-shadow: 0 2px 8px rgba(0,0,0,.8); }

  .bubble { left: 50%; top: 20%; transform: translateX(-60%); max-width: 250px; }
  .bubble .msg { background: #fdf3dd; color: #3c2a16; border-radius: 14px; padding: 10px 14px; font-size: 0.85rem; font-style: italic; box-shadow: 0 6px 18px rgba(0,0,0,.5); position: relative; }
  .bubble .msg::after { content: ""; position: absolute; left: 24px; bottom: -8px; width: 0; height: 0; border: 8px solid transparent; border-top-color: #fdf3dd; border-bottom: 0; }
  .bubble .who { font-style: normal; font-weight: 600; display: block; }

  .bowl { bottom: 20px; left: 20px; }
  .bowl .tag { font-size: 0.72rem; color: #f0e2bd; text-align: center; margin-top: 3px; text-shadow: 0 1px 4px rgba(0,0,0,.9); }
  .lantern { bottom: 20px; left: 120px; }
  .lantern .tag { font-size: 0.72rem; color: #f0e2bd; text-align: center; margin-top: 3px; text-shadow: 0 1px 4px rgba(0,0,0,.9); }
  .letter { bottom: 22px; right: 20px; transform: rotate(-5deg); }
  .letter .tag { font-size: 0.72rem; color: #f0e2bd; text-align: center; margin-top: 3px; text-shadow: 0 1px 4px rgba(0,0,0,.9); }

  /* the stall counter, the only interface surface */
  .counter { bottom: 0; left: 0; right: 0; height: 92px; background: linear-gradient(180deg, #4a2f17, #2e1c0c); border-top: 4px solid #6b4e1f; box-shadow: 0 -6px 24px rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; gap: 12px; }
  .counter .slate {
    width: 92px; height: 50px; border-radius: 6px; background: #1f2b26; border: 3px solid #7a6a4a;
    display: grid; place-items: center; font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 1.4rem; color: #fdf3dd;
  }
  .counter .cost { font-size: 0.78rem; color: #f0e2bd; line-height: 1.35; text-shadow: 0 1px 3px rgba(0,0,0,.8); }
  .counter .cost b { color: #ffd98a; }
  .counter button {
    font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 0.9rem; color: #241505;
    padding: 11px 18px; border: 2px solid #7a5a26; border-radius: 8px; cursor: pointer;
    background: linear-gradient(180deg, #e8c07c, #c99b52);
    box-shadow: inset 0 2px 0 rgba(255,255,255,.4), 0 4px 0 #6b4e1f;
  }
  .counter button:active { transform: translateY(2px); box-shadow: inset 0 2px 0 rgba(255,255,255,.4), 0 1px 0 #6b4e1f; }
  .counter button.accept { background: linear-gradient(180deg, #f0d48e, #d3a44e); }
  .counter button.quit { background: linear-gradient(180deg, #a56a55, #7d4a38); color: #fdf3dd; border-color: #4c2a1e; }

  @media (max-width: 620px) {
    .counter { height: 84px; gap: 8px; }
    .counter button { font-size: 0.75rem; padding: 9px 10px; }
    .counter .slate { width: 70px; height: 44px; font-size: 1.15rem; }
    .bubble { max-width: 170px; top: 24%; }
    .bubble .msg { font-size: 0.75rem; padding: 8px 10px; }
  }
</style>
</head>
<body>
<div class="scene">
<svg viewBox="0 0 1200 760" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Bounty Bay market at dusk. Lanterns hang over a wooden stall with a striped awning. A merchant stands behind the counter. The Ruby Compass glows on a velvet cloth. The sea and a ship silhouette rest on the horizon.">
  <defs>
    <linearGradient id="skyM" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#16323c"/><stop offset="55%" stop-color="#1e4a52"/><stop offset="100%" stop-color="#d98a4e"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1a3a44"/><stop offset="100%" stop-color="#0e1e26"/></linearGradient>
    <radialGradient id="lanternGlow" cx="50%" cy="50%"><stop offset="0%" stop-color="#ffc46b" stop-opacity=".55"/><stop offset="100%" stop-color="#ffc46b" stop-opacity="0"/></radialGradient>
    <radialGradient id="rubyM" cx="36%" cy="28%"><stop offset="0%" stop-color="#ff93a8"/><stop offset="45%" stop-color="#c22b4e"/><stop offset="100%" stop-color="#4a0a1e"/></radialGradient>
    <linearGradient id="brassM" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#e3bd77"/><stop offset="100%" stop-color="#8a6b34"/></linearGradient>
    <linearGradient id="awning" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#c96a3f"/><stop offset="100%" stop-color="#a34a2c"/></linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="soft2" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="2.5"/></filter>
  </defs>

  <!-- sky, moon, sea -->
  <rect width="1200" height="760" fill="url(#skyM)"/>
  <circle cx="930" cy="120" r="46" fill="#ffe9b8" opacity=".9" filter="url(#soft2)"/>
  <circle cx="916" cy="108" r="42" fill="url(#skyM)" opacity=".55"/>
  <rect y="300" width="1200" height="160" fill="url(#sea)"/>
  <g stroke="#4a6a72" stroke-width="2" opacity=".55">
    <path d="M120 340 q60 -8 120 0 M480 372 q60 -8 120 0 M820 330 q60 -8 120 0 M60 420 q60 -8 120 0 M600 430 q60 -8 120 0" fill="none"/>
  </g>
  <!-- ship silhouette -->
  <g transform="translate(960 300)">
    <path d="M-70 40 h120 l-8 -46 h-60 l-8 20 h-20 l-8 -20 h-14 z" fill="#101c22"/>
    <line x1="-18" y1="-26" x2="-18" y2="20" stroke="#101c22" stroke-width="4"/>
    <line x1="24" y1="-26" x2="24" y2="14" stroke="#101c22" stroke-width="4"/>
    <path d="M-18 -26 q42 -18 42 0 l-42 -6 z" fill="#0e181e"/>
  </g>

  <!-- skyline silhouette -->
  <path d="M0 300 h80 v-46 h26 v46 h34 v-70 h20 v70 h40 v-38 h24 v38 h60 v-58 h26 v58 h50 v-34 h22 v34 h64 v-70 h28 v70 h52 v-44 h24 v44 h70 v-64 h26 v64 h60 v-40 h22 v40 h40 v-54 h24 v54 h56 v-30 h20 v30 h40 v-52 h26 v52 h70 v-38 h24 v38 h60 v-20 h40 v20 h20 v-58 h28 v58 h34 v-26 h22 v26 h60 v0 z" fill="#0e1a20" opacity=".9"/>
  <!-- masts + rigging -->
  <g stroke="#0e1a20" stroke-width="5">
    <line x1="140" y1="160" x2="140" y2="300"/><line x1="620" y1="120" x2="620" y2="300"/><line x1="1040" y1="170" x2="1040" y2="300"/>
  </g>
  <path d="M0 200 q600 40 1200 0" fill="none" stroke="#0e1a20" stroke-width="3" opacity=".8"/>
  <g stroke="#0e1a20" stroke-width="2" opacity=".8">
    <path d="M120 240 q200 14 460 -4 M620 220 q200 -6 420 -20" fill="none"/>
  </g>

  <!-- string lights -->
  <path d="M60 90 Q600 190 1140 90" fill="none" stroke="#241a10" stroke-width="3"/>
  <g fill="#ffc46b" filter="url(#soft2)">
    <circle cx="180" cy="122" r="5"/><circle cx="330" cy="138" r="5"/><circle cx="480" cy="144" r="5"/>
    <circle cx="630" cy="140" r="5"/><circle cx="780" cy="126" r="5"/><circle cx="930" cy="110" r="5"/><circle cx="1060" cy="98" r="5"/>
  </g>
  <!-- hanging lanterns -->
  <g>
    <circle cx="300" cy="215" r="90" fill="url(#lanternGlow)"/>
    <line x1="300" y1="120" x2="300" y2="200" stroke="#241a10" stroke-width="3"/>
    <rect x="284" y="200" width="32" height="40" rx="7" fill="#c9763f"/>
    <rect x="290" y="207" width="20" height="26" rx="4" fill="#ffe0a0" filter="url(#soft2)"/>
  </g>
  <g>
    <circle cx="880" cy="215" r="90" fill="url(#lanternGlow)"/>
    <line x1="880" y1="120" x2="880" y2="200" stroke="#241a10" stroke-width="3"/>
    <rect x="864" y="200" width="32" height="40" rx="7" fill="#c9763f"/>
    <rect x="870" y="207" width="20" height="26" rx="4" fill="#ffe0a0" filter="url(#soft2)"/>
  </g>

  <!-- THE STALL: awning + counter -->
  <path d="M130 300 h940 v36 q-8 0 -8 8 h-924 q0 -8 -8 -8 z" fill="url(#awning)" opacity=".95"/>
  <g fill="none" stroke="#fdf3dd" stroke-width="5" opacity=".9">
    <path d="M140 336 q9 18 0 36 M240 336 q9 18 0 36 M340 336 q9 18 0 36 M440 336 q9 18 0 36 M540 336 q9 18 0 36 M640 336 q9 18 0 36 M740 336 q9 18 0 36 M840 336 q9 18 0 36 M940 336 q9 18 0 36 M1040 336 q9 18 0 36"/>
  </g>
  <path d="M120 372 h960 v40 h-960 z" fill="#4a2f17"/>
  <path d="M120 372 h960 v40 h-960 z" fill="none" stroke="#6b4e1f" stroke-width="4"/>
  <g stroke="#241505" stroke-width="3" opacity=".5">
    <path d="M120 392 h960 M120 404 h960" fill="none"/>
  </g>
  <!-- awning posts -->
  <rect x="118" y="320" width="14" height="180" fill="#5e3c1e"/>
  <rect x="1068" y="320" width="14" height="180" fill="#5e3c1e"/>

  <!-- THE OPPONENT MERCHANT behind the counter -->
  <g transform="translate(600 360)">
    <ellipse cx="0" cy="150" rx="95" ry="16" fill="#000" opacity=".4" filter="url(#soft)"/>
    <circle cx="0" cy="26" r="30" fill="#c98a5e"/>
    <path d="M-30 12 q30 -34 60 0 l-6 40 q-24 8 -48 0 z" fill="#2b1a0c"/>
    <path d="M-20 40 q-4 6 0 10 M20 40 q4 6 0 10" stroke="#241505" stroke-width="3" fill="none"/>
    <path d="M-34 58 q34 10 68 0 l-6 -16 q-28 -8 -56 0 z" fill="#3c2a16"/>
    <path d="M-58 96 q0 -44 58 -44 q58 0 58 44 l0 52 q-58 24 -116 0 z" fill="#a34a2c"/>
    <path d="M-58 96 l0 52 q-58 24 -116 0" fill="none"/>
    <path d="M-52 104 h-40 M-52 122 h-40" stroke="#5e2c18" stroke-width="10" opacity=".8"/>
    <path d="M-92 78 q-10 14 -16 34 M-96 86 q-6 6 -12 12" stroke="#c98a5e" stroke-width="10" fill="none" opacity=".9"/>
    <path d="M58 96 l0 52 q58 24 116 0" fill="none"/>
    <path d="M52 104 h40 M52 122 h40" stroke="#5e2c18" stroke-width="10" opacity=".8"/>
    <path d="M92 78 q10 14 16 34 M96 86 q6 6 12 12" stroke="#c98a5e" stroke-width="10" fill="none" opacity=".9"/>
    <!-- rim light -->
    <path d="M-30 12 q30 -34 60 0" fill="none" stroke="#ffc46b" stroke-width="3" opacity=".5" filter="url(#soft2)"/>
  </g>

  <!-- THE RUBY COMPASS on velvet on the counter -->
  <g transform="translate(600 505)">
    <ellipse cx="0" cy="66" rx="190" ry="30" fill="#000" opacity=".5" filter="url(#soft)"/>
    <ellipse cx="0" cy="50" rx="128" ry="24" fill="#3c1330" stroke="#c9a15a" stroke-width="3"/>
    <circle cx="0" cy="0" r="76" fill="url(#brassM)"/>
    <circle cx="0" cy="0" r="70" fill="url(#rubyM)"/>
    <ellipse cx="-18" cy="-22" rx="30" ry="17" fill="#ffffff" opacity=".3" filter="url(#soft2)"/>
    <circle cx="0" cy="0" r="70" fill="none" stroke="#e3bd77" stroke-width="3"/>
    <g stroke="#e3bd77" stroke-width="3">
      <line x1="0" y1="-70" x2="0" y2="-54"/><line x1="0" y1="54" x2="0" y2="70"/>
      <line x1="-70" y1="0" x2="-54" y2="0"/><line x1="54" y1="0" x2="70" y2="0"/>
      <line x1="-49" y1="-49" x2="-40" y2="-40"/><line x1="49" y1="-49" x2="40" y2="-40"/>
      <line x1="-49" y1="49" x2="-40" y2="40"/><line x1="49" y1="49" x2="40" y2="40"/>
    </g>
    <polygon points="0,-46 9,5 0,0 -9,5" fill="#ffd98a"/>
    <polygon points="0,46 -9,-5 0,0 9,-5" fill="#e8dcc0"/>
    <circle cx="0" cy="0" r="8" fill="#c9a15a" stroke="#5e3c1e" stroke-width="2"/>
  </g>

  <!-- THEIR OFFER signboard, hanging near the merchant -->
  <g transform="translate(392 380)">
    <line x1="0" y1="0" x2="0" y2="58" stroke="#241a10" stroke-width="4"/>
    <rect x="-52" y="52" width="104" height="52" rx="6" fill="url(#brassM)" stroke="#5e3c1e" stroke-width="3"/>
    <text x="0" y="88" text-anchor="middle" font-family="Nunito, sans-serif" font-size="26" font-weight="800" fill="#241505">82.5</text>
  </g>
  <!-- MY OFFER signboard, near my side -->
  <g transform="translate(808 388)">
    <line x1="0" y1="0" x2="0" y2="50" stroke="#241a10" stroke-width="4"/>
    <rect x="-52" y="50" width="104" height="52" rx="6" fill="url(#brassM)" stroke="#5e3c1e" stroke-width="3"/>
    <text x="0" y="86" text-anchor="middle" font-family="Nunito, sans-serif" font-size="26" font-weight="800" fill="#241505">63.0</text>
  </g>
  <!-- small price slate: the gap, quietly -->
  <g transform="translate(600 415)">
    <rect x="-46" y="-16" width="92" height="32" rx="4" fill="#1f2b26" stroke="#7a6a4a" stroke-width="3"/>
    <text x="0" y="6" text-anchor="middle" font-family="Nunito, sans-serif" font-size="15" font-weight="700" fill="#fdf3dd">gap 19.5</text>
  </g>

  <!-- my gear on the counter edge: coin bowl + oil lantern -->
  <g transform="translate(150 470)">
    <path d="M-44 0 q0 -20 44 -20 q44 0 44 20 z" fill="#6b4e1f"/>
    <ellipse cx="0" cy="-4" rx="38" ry="12" fill="#c9a15a"/>
    <ellipse cx="-6" cy="-12" rx="24" ry="9" fill="#e3bd77"/><ellipse cx="10" cy="-16" rx="20" ry="8" fill="#ffd98a"/>
    <text x="0" y="26" text-anchor="middle" font-size="13" fill="#f0e2bd">72 coins</text>
  </g>
  <g transform="translate(262 470)">
    <circle cx="0" cy="-6" r="52" fill="url(#lanternGlow)"/>
    <rect x="-7" y="-8" width="14" height="40" rx="3" fill="#3a2c1c"/>
    <rect x="-16" y="-20" width="32" height="20" rx="5" fill="#c9763f"/>
    <rect x="-11" y="-15" width="22" height="10" rx="3" fill="#ffe0a0" filter="url(#soft2)"/>
    <text x="0" y="46" text-anchor="middle" font-size="12.5" fill="#f0e2bd">bounty × 91%</text>
  </g>
  <!-- my sealed letter tucked at the counter -->
  <g transform="translate(1050 462) rotate(-5)">
    <rect x="-34" y="-14" width="92" height="28" rx="2" fill="#e8dcc0" stroke="#c9b98d" stroke-width="2"/>
    <circle cx="34" cy="0" r="8" fill="#7a2020"/>
  </g>
</svg>
</div>

<div class="ui">
  <div class="brand">BOUNTY BAY</div>
  <div class="turn">Your move, merchant.</div>

  <div class="bubble">
    <div class="msg"><span class="who">The stallkeeper:</span> "I can move, but not much."</div>
  </div>

  <div class="counter">
    <div class="slate">60</div>
    <div class="cost">move −3.0<br>cost <b>5</b> · <b>67</b> left</div>
    <button>Make Offer</button>
    <button class="accept">Accept 82.5</button>
    <button class="quit">Walk Away</button>
  </div>
</div>
</body>
</html>
